<!DOCTYPE html>
<html>
<head>
    <title>Test Login Simple</title>
</head>
<body>
    <h2>🔐 Test Login Simple</h2>
    
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" value="admin"><br>
        <input type="password" id="password" placeholder="Password" value="admin123"><br>
        <button type="submit">Login</button>
    </form>
    
    <h3>Résultat:</h3>
    <pre id="result" style="background:#f4f4f4; padding:10px;"></pre>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            
            try {
                const res = await fetch('http://localhost:8000/api/users/login/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await res.json();
                document.getElementById('result').innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').innerText = 'Erreur: ' + error.message;
            }
        };
    </script>
</body>
</html>
